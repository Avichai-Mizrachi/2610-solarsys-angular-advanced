<h2>Efficiency</h2>

<div class="card">
  <table>
    <thead>
      <tr>
        <th>Day</th>
        <th class="number">Sunlight (h)</th>
        <th class="number">Energy (kWh)</th>
        <th class="number">kWh / h</th>
      </tr>
    </thead>
    <tbody>
      @for (row of vm().rows; track row.day) {
        <tr>
          <td>{{ row.day | date }}</td>
          <td class="number">{{ row.sunlightHours | number: '1.1-1' }}</td>
          <td class="number">{{ row.energyKwh | number: '1.1-1' }}</td>
          <td class="number efficiency">{{ row.efficiency | number: '1.1-1' }}</td>
        </tr>
      } @empty {
        <tr>
          <td class="empty" colspan="4">No activity in this period</td>
        </tr>
      }
    </tbody>
  </table>
</div>
